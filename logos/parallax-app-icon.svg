<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="px-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="23.04" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="px-glow-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11.26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="px-outer" x1="0" y1="1" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4EE7FD"/>
      <stop offset="50%"  stop-color="#9966FF"/>
      <stop offset="100%" stop-color="#FF9B2B"/>
    </linearGradient>
    <linearGradient id="px-merk-dn" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#4EE7FD"/>
      <stop offset="100%" stop-color="#FF9B2B"/>
    </linearGradient>
    <linearGradient id="px-merk-up" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#d4b0ff"/>
      <stop offset="100%" stop-color="#9966FF"/>
    </linearGradient>
    <linearGradient id="px-fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4EE7FD" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#9966FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF9B2B" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114.55" fill="#0A0A0E"/>

  <circle cx="256" cy="256" r="197.80" fill="none" stroke="rgba(242,239,230,0.14)" stroke-width="5.12"/>
  <circle cx="256" cy="256" r="197.80" fill="none" stroke="rgba(153,102,255,0.10)" stroke-width="17.92" filter="url(#px-glow)"/>

  <polygon points="256.00,49.60 434.75,359.20 77.25,359.20"
    fill="none" stroke="url(#px-outer)" stroke-width="24.78"
    stroke-linejoin="round" opacity="0.45" filter="url(#px-glow)"/>
  <polygon points="256.00,49.60 434.75,359.20 77.25,359.20" fill="url(#px-fill)"/>
  <polygon points="256.00,49.60 434.75,359.20 77.25,359.20"
    fill="none" stroke="url(#px-outer)" stroke-width="11.26"
    stroke-linejoin="round" filter="url(#px-glow-soft)"/>
  <polygon points="256.00,49.60 434.75,359.20 77.25,359.20"
    fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.48"
    stroke-linejoin="round"/>

  <polygon points="256.00,346.30 177.80,210.85 334.20,210.85"
    fill="none" stroke="url(#px-merk-dn)" stroke-width="8.70"
    stroke-linejoin="round" filter="url(#px-glow-soft)" opacity="0.95"/>
  <polygon points="256.00,346.30 177.80,210.85 334.20,210.85"
    fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.18"
    stroke-linejoin="round"/>

  <polygon points="256.00,165.70 334.20,301.15 177.80,301.15"
