  <circle cx="256" cy="58.20" r="19.46" fill="#9966FF" opacity="0.45" filter="url(#px-glow)"/>
  <circle cx="256" cy="58.20" r="10.70" fill="none" stroke="#c8a8ff" stroke-width="7.17"/>
  <circle cx="256" cy="58.20" r="4.28" fill="#ffffff"/>

  <circle cx="453.80" cy="256" r="19.46" fill="#FF9B2B" opacity="0.45" filter="url(#px-glow)"/>
  <circle cx="453.80" cy="256" r="10.70" fill="none" stroke="#ffd28a" stroke-width="7.17"/>
  <circle cx="453.80" cy="256" r="4.28" fill="#ffffff"/>

  <circle cx="256" cy="453.80" r="19.46" fill="#4EE7FD" opacity="0.45" filter="url(#px-glow)"/>
  <circle cx="256" cy="453.80" r="10.70" fill="none" stroke="#a8f5ff" stroke-width="7.17"/>
  <circle cx="256" cy="453.80" r="4.28" fill="#ffffff"/>

  <circle cx="58.20" cy="256" r="19.46" fill="#4EE7FD" opacity="0.45" filter="url(#px-glow)"/>
  <circle cx="58.20" cy="256" r="10.70" fill="none" stroke="#a8f5ff" stroke-width="7.17"/>
  <circle cx="58.20" cy="256" r="4.28" fill="#ffffff"/>

  <circle cx="256" cy="256" r="23.35" fill="#ffffff" opacity="0.10" filter="url(#px-glow)"/>
  <circle cx="256" cy="256" r="6.81" fill="#ffffff" opacity="0.95"/>
</svg>
