<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0A1212; margin: 0; padding: 14px 16px; font-family: 'Fira Mono', monospace; }
  .section-label { font-size: 9px; color: #52525b; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }

  .badge { display: inline-flex; align-items: center; padding: 3px 9px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 3px; white-space: nowrap; }
  .badge-default { border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04); color: #71717a; }
  .badge-cyan    { border: 1px solid rgba(34,211,238,0.28); background: rgba(34,211,238,0.07); color: #67E8F9; }
  .badge-gold    { border: 1px solid rgba(180,143,74,0.32); background: rgba(180,143,74,0.08); color: #C5A05B; }
  .badge-ruby    { border: 1px solid rgba(255,58,92,0.3); background: rgba(255,58,92,0.07); color: #FF3A5C; }
  .badge-violet  { border: 1px solid rgba(176,58,255,0.3); background: rgba(176,58,255,0.07); color: #B03AFF; }
  .badge-emerald { border: 1px solid rgba(42,255,160,0.3); background: rgba(42,255,160,0.07); color: #2AFFA0; }

  /* Nav strip */
  .nav-strip { display: flex; align-items: center; gap: 4px; background: rgba(10,18,18,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); border-radius: 9999px; padding: 6px 10px; width: fit-content; position: relative; overflow: hidden; }
  .nav-strip::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background: linear-gradient(90deg,transparent,rgba(34,211,238,0.2),transparent); }
  .nav-item { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; color: #71717a; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .nav-item.active { color: #67E8F9; background: rgba(34,211,238,0.08); border-color: rgba(34,211,238,0.2); }
  .nav-item:hover { color: rgba(200,230,255,0.9); background: rgba(255,255,255,0.04); }
  .active-dot { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #22D3EE; box-shadow: 0 0 5px #22d3ee; }
  .nav-logo { display: flex; align-items: center; gap: 8px; margin-right: 10px; padding-right: 10px; border-right: 1px solid rgba(255,255,255,0.06); }
  .logo-mark { width: 24px; height: 24px; }
  .logo-text { font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; letter-spacing: 0.25em; color: #e4e4e7; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="section-label">Badges</div>
  <div class="row">
    <span class="badge badge-default">Esoteric</span>
    <span class="badge badge-cyan">Philosophy</span>
    <span class="badge badge-gold">The Scholar</span>
    <span class="badge badge-ruby">Scientific</span>
    <span class="badge badge-violet">Mathematical</span>
    <span class="badge badge-emerald">Spiritual</span>
  </div>

  <div class="section-label">Navigation</div>
  <div class="nav-strip">
    <div class="nav-logo">
      <svg class="logo-mark" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="40" stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.5"/>
        <circle cx="50" cy="50" r="20" stroke="#22D3EE" stroke-width="1" fill="none"/>
        <circle cx="50" cy="50" r="4" fill="#22D3EE"/>
      </svg>
      <span class="logo-text">Prismarium</span>
    </div>
    <div class="nav-item active" style="position:relative;">
      Library
      <div class="active-dot"></div>
    </div>
    <div class="nav-item">Courses</div>
    <div class="nav-item">Journal</div>
    <div class="nav-item">Graph</div>
  </div>
</body>
</html>
