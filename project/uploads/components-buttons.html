<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0A1212; margin: 0; padding: 18px 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .section-label { font-family: 'Fira Mono', monospace; font-size: 9px; color: #52525b; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }

  /* Primary / Cyan */
  .btn-cyan {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 4px; border: none; cursor: pointer;
    background: #06B6D4; color: #000;
    box-shadow: 0 0 20px rgba(6,182,212,0.35);
    transition: all 0.2s ease;
  }
  .btn-cyan:hover { background: #22D3EE; box-shadow: 0 0 40px rgba(6,182,212,0.55); transform: translateY(-1px); }

  /* Ghost / Violet */
  .btn-ghost {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 4px; cursor: pointer;
    background: transparent; color: rgba(200,180,255,0.8);
    border: 1px solid rgba(140,100,255,0.35);
    transition: all 0.2s ease;
  }
  .btn-ghost:hover { border-color: rgba(180,140,255,0.7); color: white; background: rgba(100,60,200,0.1); }

  /* Gold */
  .btn-gold {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 4px; cursor: pointer;
    background: transparent; color: #B48F4A;
    border: 1px solid rgba(180,143,74,0.35);
    transition: all 0.2s ease;
  }
  .btn-gold:hover { border-color: rgba(180,143,74,0.65); box-shadow: 0 0 20px rgba(180,143,74,0.25); }

  /* Danger */
  .btn-danger {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    padding: 9px 20px; border-radius: 4px; cursor: pointer;
    background: rgba(139,46,46,0.15); color: #f87171;
    border: 1px solid rgba(139,46,46,0.4);
    transition: all 0.2s ease;
  }
  .btn-danger:hover { background: rgba(139,46,46,0.28); }

  /* Disabled */
  .btn-disabled {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 4px; border: none;
    background: #06B6D4; color: #000; opacity: 0.4; cursor: not-allowed;
  }

  /* Small icon button */
  .btn-icon {
    width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); color: #71717a; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .btn-icon:hover { border-color: rgba(34,211,238,0.3); color: #22D3EE; }

  /* Pill join */
  .btn-join {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 8px 18px; border-radius: 4px; border: none; cursor: pointer;
    background: #22D3EE; color: #000;
    box-shadow: 0 0 15px rgba(6,182,212,0.3);
  }
</style>
</head>
<body>
  <div class="section-label">Primary</div>
  <div class="row">
    <button class="btn-cyan">Enter the Prismarium</button>
    <button class="btn-ghost">Explore the Ecosystem</button>
    <button class="btn-gold">View Full Text</button>
  </div>
  <div class="section-label">States &amp; Variants</div>
  <div class="row">
    <button class="btn-danger">Disconnect</button>
    <button class="btn-disabled" disabled>Signing in...</button>
    <button class="btn-join">Join Prismarium &gt;</button>
    <button class="btn-icon" title="Edit">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="btn-icon" title="Search">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
</body>
</html>
