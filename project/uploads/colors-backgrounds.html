<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #181818; margin: 0; padding: 16px; font-family: 'Fira Mono', monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 110px; border-radius: 6px; padding: 14px 12px 10px; border: 1px solid rgba(255,255,255,0.08); }
  .swatch-color { height: 40px; border-radius: 4px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.08); }
  .swatch-name { font-size: 10px; color: #71717a; letter-spacing: 0.08em; text-transform: uppercase; }
  .swatch-hex  { font-size: 12px; color: #e4e4e7; margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#0A1212;"></div>
    <div class="swatch-name">Void Black</div>
    <div class="swatch-hex">#0A1212</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#0D1425;"></div>
    <div class="swatch-name">Midnight Slate</div>
    <div class="swatch-hex">#0D1425</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#0B1616;"></div>
    <div class="swatch-name">Scanline Black</div>
    <div class="swatch-hex">#0B1616</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#111818;"></div>
    <div class="swatch-name">Card BG</div>
    <div class="swatch-hex">#111818</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:rgba(10,18,18,0.7); backdrop-filter:blur(8px);"></div>
    <div class="swatch-name">Glass Panel</div>
    <div class="swatch-hex">rgba(10,18,18,0.7)</div>
  </div>
</div>
</body>
</html>
