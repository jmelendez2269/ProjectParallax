<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #070710; margin: 0; padding: 16px; font-family: 'Fira Mono', monospace; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .panel { flex: 1; min-width: 120px; border-radius: 10px; padding: 14px 14px 12px; }
  .panel-label { font-size: 9px; color: #52525b; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
  .panel-name  { font-size: 11px; color: #a1a1aa; }
  .glass-default { background: rgba(10,18,18,0.70); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); }
  .shadow-cyan   { background: #0A1212; border: 1px solid rgba(34,211,238,0.25); box-shadow: 0 0 20px rgba(6,182,212,0.25); }
  .shadow-gold   { background: #0A1212; border: 1px solid rgba(180,143,74,0.35); box-shadow: 0 0 20px rgba(180,143,74,0.25); }
  .shadow-dark   { background: #111818; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
  .corner-decor  { background: rgba(10,18,18,0.80); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); position: relative; overflow: hidden; }
  .corner-decor::before { content:''; position:absolute; top:0; left:0; width:8px; height:8px; border-top: 1px solid rgba(34,211,238,0.5); border-left: 1px solid rgba(34,211,238,0.5); }
  .corner-decor::after  { content:''; position:absolute; bottom:0; right:0; width:8px; height:8px; border-bottom: 1px solid rgba(34,211,238,0.5); border-right: 1px solid rgba(34,211,238,0.5); }
  .gradient-top { background: rgba(10,18,18,0.80); border: 1px solid rgba(255,255,255,0.07); position: relative; overflow: hidden; }
  .gradient-top::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background: linear-gradient(90deg, transparent, rgba(34,211,238,0.3), transparent); }
</style>
</head>
<body>
<div class="row">
  <div class="panel glass-default">
    <div class="panel-label">Glass Default</div>
    <div class="panel-name">blur(12px)<br>bg 70% dark</div>
  </div>
  <div class="panel shadow-cyan">
    <div class="panel-label">Cyan Glow</div>
    <div class="panel-name">Active / Focus<br>state</div>
  </div>
  <div class="panel shadow-gold">
    <div class="panel-label">Gold Glow</div>
    <div class="panel-name">Card hover<br>prestige</div>
  </div>
  <div class="panel shadow-dark">
    <div class="panel-label">Dark Elevation</div>
    <div class="panel-name">Modal / overlay<br>shadow</div>
  </div>
  <div class="panel corner-decor">
    <div class="panel-label">Corner Cuts</div>
    <div class="panel-name">Cyber panel<br>detail</div>
  </div>
  <div class="panel gradient-top">
    <div class="panel-label">Gradient Edge</div>
    <div class="panel-name">Header / panel<br>top border</div>
  </div>
</div>
</body>
</html>
