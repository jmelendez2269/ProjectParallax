<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismarium — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0A1212;
    color: #F1F5F9;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(6,182,212,0.04) 0%, transparent 55%),
      radial-gradient(circle at 90% 20%, rgba(6,182,212,0.02) 0%, transparent 50%);
    min-height: 100vh;
  }
  /* Grain overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.28;
    mix-blend-mode: overlay;
  }
  #root { position: relative; z-index: 2; }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #050505; }
  ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

  /* Animations needed by child components */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes spin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* Range input reset */
  input[type=range] { -webkit-appearance: none; appearance: none; }

  /* Screen transition */
  .screen-enter { animation: fadeUp 0.25s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="LibraryGrid.jsx"></script>
<script type="text/babel" src="JournalEditor.jsx"></script>
<script type="text/babel" src="ConvergenceMachine.jsx"></script>

<script type="text/babel">
const SCREENS = ['library','courses','journal','graph','convergence'];

const CoursesPlaceholder = () =>
  React.createElement('div', { style:{ padding:'60px 48px', maxWidth:640 } },
    React.createElement('div', { style:{ fontFamily:"'Fira Mono',monospace", fontSize:9, color:'rgba(34,211,238,0.5)', letterSpacing:'0.3em', textTransform:'uppercase', marginBottom:8 } }, 'Coming in Phase 2'),
    React.createElement('h1', { style:{ fontFamily:"'Cinzel',serif", fontSize:32, fontWeight:600, color:'#f1f5f9', marginBottom:12, letterSpacing:'-0.01em' } }, 'Courses'),
    React.createElement('p', { style:{ fontFamily:"'Cormorant Garamond',serif", fontSize:17, fontStyle:'italic', color:'#71717a', lineHeight:1.7 } },
      'Structured learning paths through the wisdom traditions are being developed. In the meantime, explore the Library or deepen your inquiry with the Convergence Machine.'
    ),
    React.createElement('div', { style:{ marginTop:32, display:'flex', gap:10 } },
      React.createElement('div', { style:{ padding:'20px 24px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10, flex:1 } },
        React.createElement('div', { style:{ fontFamily:"'Cinzel',serif", fontSize:14, fontWeight:600, color:'#f1f5f9', marginBottom:6 } }, 'Introduction to Hermeticism'),
        React.createElement('div', { style:{ fontSize:12, color:'#52525b', fontFamily:"'Fira Mono',monospace", letterSpacing:'0.08em' } }, '8 lessons · Coming soon')
      ),
      React.createElement('div', { style:{ padding:'20px 24px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10, flex:1 } },
        React.createElement('div', { style:{ fontFamily:"'Cinzel',serif", fontSize:14, fontWeight:600, color:'#f1f5f9', marginBottom:6 } }, 'Sacred Geometry Fundamentals'),
        React.createElement('div', { style:{ fontSize:12, color:'#52525b', fontFamily:"'Fira Mono',monospace", letterSpacing:'0.08em' } }, '12 lessons · Coming soon')
      )
    )
  );

const GraphPlaceholder = () =>
  React.createElement('div', { style:{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:16, padding:40 } },
    React.createElement('div', { style:{ position:'relative', width:220, height:220 } },
      // Animated network nodes
      ...[
        { cx:110, cy:40, r:6, color:'#22D3EE', label:'Emptiness' },
        { cx:40,  cy:130, r:5, color:'#2AFFA0', label:'Śūnyatā' },
        { cx:180, cy:130, r:5, color:'#3A7FFF', label:'Zero-point' },
        { cx:110, cy:180, r:5, color:'#B03AFF', label:'Ain Soph' },
        { cx:60,  cy:75,  r:4, color:'#FF8C2A', label:'Wu' },
        { cx:170, cy:75,  r:4, color:'#F5D020', label:'Apophasis' },
      ].map((n,i) =>
        React.createElement('g', { key:i },
          React.createElement('circle', { cx:n.cx, cy:n.cy, r:n.r, fill:n.color, opacity:0.9 }),
          React.createElement('circle', { cx:n.cx, cy:n.cy, r:n.r*2.5, fill:n.color, opacity:0.12 }),
        )
      ),
      React.createElement('svg', { style:{ position:'absolute', inset:0 }, viewBox:'0 0 220 220' },
        React.createElement('line', { x1:110, y1:40, x2:40, y2:130, stroke:'rgba(34,211,238,0.2)', strokeWidth:1 }),
        React.createElement('line', { x1:110, y1:40, x2:180, y2:130, stroke:'rgba(34,211,238,0.2)', strokeWidth:1 }),
        React.createElement('line', { x1:110, y1:40, x2:110, y2:180, stroke:'rgba(34,211,238,0.15)', strokeWidth:1 }),
        React.createElement('line', { x1:40, y1:130, x2:110, y2:180, stroke:'rgba(42,255,160,0.2)', strokeWidth:1 }),
        React.createElement('line', { x1:180, y1:130, x2:110, y2:180, stroke:'rgba(58,127,255,0.2)', strokeWidth:1 }),
        React.createElement('line', { x1:60, y1:75, x2:110, y2:40, stroke:'rgba(255,140,42,0.18)', strokeWidth:1 }),
        React.createElement('line', { x1:170, y1:75, x2:110, y2:40, stroke:'rgba(245,208,32,0.18)', strokeWidth:1 }),
        ...[
          { cx:110, cy:40, r:6, color:'#22D3EE', label:'Emptiness' },
          { cx:40,  cy:130, r:5, color:'#2AFFA0', label:'Śūnyatā' },
          { cx:180, cy:130, r:5, color:'#3A7FFF', label:'Zero-point' },
          { cx:110, cy:180, r:5, color:'#B03AFF', label:'Ain Soph' },
          { cx:60,  cy:75,  r:4, color:'#FF8C2A', label:'Wu' },
          { cx:170, cy:75,  r:4, color:'#F5D020', label:'Apophasis' },
        ].map((n,i) => [
          React.createElement('circle', { key:`c${i}`, cx:n.cx, cy:n.cy, r:n.r, fill:n.color, opacity:0.9 }),
          React.createElement('text', { key:`t${i}`, x:n.cx, y:n.cy - n.r - 4, textAnchor:'middle', fontSize:7, fontFamily:'Fira Mono', fill:n.color, opacity:0.8 }, n.label)
        ]).flat()
      )
    ),
    React.createElement('div', { style:{ fontFamily:"'Fira Mono',monospace", fontSize:9, color:'rgba(34,211,238,0.5)', letterSpacing:'0.3em', textTransform:'uppercase' } }, 'Coming in Phase 3'),
    React.createElement('h2', { style:{ fontFamily:"'Cinzel',serif", fontSize:24, fontWeight:600, color:'#f1f5f9', letterSpacing:'-0.01em' } }, 'The Convergence Graph'),
    React.createElement('p', { style:{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, fontStyle:'italic', color:'#71717a', maxWidth:400, textAlign:'center', lineHeight:1.7 } }, 'Visual maps revealing how all traditions express the same fundamental truths.')
  );

const App = () => {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('prismarium_screen') || 'library');

  React.useEffect(() => {
    localStorage.setItem('prismarium_screen', screen);
  }, [screen]);

  const renderScreen = () => {
    switch(screen) {
      case 'library':    return React.createElement(LibraryGrid);
      case 'courses':    return React.createElement(CoursesPlaceholder);
      case 'journal':    return React.createElement(JournalEditor);
      case 'graph':      return React.createElement(GraphPlaceholder);
      case 'convergence': return React.createElement(ConvergenceMachine);
      default:           return React.createElement(LibraryGrid);
    }
  };

  return React.createElement('div', { style:{ minHeight:'100vh', display:'flex', flexDirection:'column' } },
    React.createElement(PrismariumHeader, { activeScreen: screen, setActiveScreen: setScreen }),
    React.createElement('main', { key: screen, className:'screen-enter', style:{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' } },
      renderScreen()
    )
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
