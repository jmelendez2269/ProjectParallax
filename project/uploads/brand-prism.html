<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04040f; overflow: hidden; height: 150px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; }
  .scene { position: relative; width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; }
  .dome-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(14,10,40,0.9) 0%, rgba(4,4,15,0.98) 70%); }
  .prism-wrap { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 0 16px rgba(160,100,255,0.9)); animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 8px rgba(200,160,255,0.6))} 50%{filter:drop-shadow(0 0 24px rgba(200,160,255,1)) drop-shadow(0 0 50px rgba(140,80,255,0.6))} }
  .rays { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .lens-nodes { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; z-index: 10; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .orb { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 8px; animation: float 6s ease-in-out infinite; }
  .orb-label { font-family: 'Fira Mono', monospace; font-size: 7px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.7; color: rgba(220,200,255,0.8); white-space: nowrap; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
</style>
</head>
<body>
<div class="scene">
  <div class="dome-bg"></div>
  <svg class="rays" viewBox="0 0 700 150" preserveAspectRatio="none">
    <defs>
      <filter id="br"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <polygon points="350,2 250,150 290,150" fill="#FF3A5C" opacity="0.45" filter="url(#br)"/>
    <polygon points="350,2 285,150 315,150" fill="#FF8C2A" opacity="0.40" filter="url(#br)"/>
    <polygon points="350,2 320,150 343,150" fill="#F5D020" opacity="0.45" filter="url(#br)"/>
    <polygon points="350,2 340,150 360,150" fill="#2AFFA0" opacity="0.40" filter="url(#br)"/>
    <polygon points="350,2 357,150 378,150" fill="#20E0F5" opacity="0.45" filter="url(#br)"/>
    <polygon points="350,2 385,150 415,150" fill="#3A7FFF" opacity="0.40" filter="url(#br)"/>
    <polygon points="350,2 410,150 450,150" fill="#B03AFF" opacity="0.45" filter="url(#br)"/>
    <circle cx="350" cy="4" r="30" fill="rgba(200,160,255,0.10)" filter="url(#br)"/>
  </svg>
  <div class="prism-wrap">
    <svg width="40" height="44" viewBox="0 0 72 80" fill="none">
      <defs>
        <linearGradient id="fl" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity="0.9"/><stop offset="100%" stop-color="#6040c0" stop-opacity="0.5"/></linearGradient>
        <linearGradient id="fr" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a0c8ff" stop-opacity="0.85"/><stop offset="100%" stop-color="#2040a0" stop-opacity="0.4"/></linearGradient>
        <linearGradient id="fc" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity="0.95"/><stop offset="100%" stop-color="#8060c0" stop-opacity="0.5"/></linearGradient>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff3a5c" stop-opacity="0.8"/><stop offset="50%" stop-color="#2affa0" stop-opacity="0.8"/><stop offset="100%" stop-color="#b03aff" stop-opacity="0.8"/></linearGradient>
      </defs>
      <polygon points="36,4 8,64 36,72" fill="url(#fl)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
      <polygon points="36,4 64,64 36,72" fill="url(#fr)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
      <polygon points="36,4 8,64 64,64" fill="url(#fc)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" opacity="0.7"/>
      <line x1="8" y1="64" x2="64" y2="64" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="5" r="3" fill="white" opacity="0.9"/>
    </svg>
  </div>
  <div class="lens-nodes">
    <div class="node" style="animation-delay:-0s"><div class="orb" style="background:radial-gradient(circle,#FF3A5C,#800020);box-shadow:0 0 10px rgba(255,58,92,0.5);animation-delay:0s"></div><div class="orb-label">Science</div></div>
    <div class="node" style="animation-delay:-1s"><div class="orb" style="background:radial-gradient(circle,#FF8C2A,#803010);box-shadow:0 0 10px rgba(255,140,42,0.5);animation-delay:-1s"></div><div class="orb-label">Psych</div></div>
    <div class="node" style="animation-delay:-2s"><div class="orb" style="background:radial-gradient(circle,#F5D020,#806010);box-shadow:0 0 10px rgba(245,208,32,0.5);animation-delay:-2s"></div><div class="orb-label">Philos</div></div>
    <div class="node" style="animation-delay:-3s"><div class="orb" style="background:radial-gradient(circle,#2AFFA0,#008050);box-shadow:0 0 10px rgba(42,255,160,0.5);animation-delay:-3s"></div><div class="orb-label">Spirit</div></div>
    <div class="node" style="animation-delay:-1.5s"><div class="orb" style="background:radial-gradient(circle,#20E0F5,#007080);box-shadow:0 0 10px rgba(32,224,245,0.5);animation-delay:-1.5s"></div><div class="orb-label">History</div></div>
    <div class="node" style="animation-delay:-2.5s"><div class="orb" style="background:radial-gradient(circle,#3A7FFF,#103080);box-shadow:0 0 10px rgba(58,127,255,0.5);animation-delay:-2.5s"></div><div class="orb-label">Occult</div></div>
    <div class="node" style="animation-delay:-0.5s"><div class="orb" style="background:radial-gradient(circle,#B03AFF,#500080);box-shadow:0 0 10px rgba(176,58,255,0.5);animation-delay:-0.5s"></div><div class="orb-label">Math</div></div>
  </div>
</div>
</body>
</html>
