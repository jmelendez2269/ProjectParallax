<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0f0f0f; margin: 0; padding: 16px; font-family: 'Fira Mono', monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { flex: 1; min-width: 90px; border-radius: 6px; padding: 14px 12px 10px; border: 1px solid rgba(255,255,255,0.06); }
  .swatch-color { height: 48px; border-radius: 4px; margin-bottom: 8px; }
  .swatch-name { font-size: 10px; color: #71717a; letter-spacing: 0.08em; text-transform: uppercase; }
  .swatch-hex  { font-size: 12px; color: #e4e4e7; margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="swatch-color" style="background:#06B6D4; box-shadow: 0 0 20px rgba(6,182,212,0.5);"></div>
    <div class="swatch-name">Cyan 600</div>
    <div class="swatch-hex">#06B6D4</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#22D3EE; box-shadow: 0 0 20px rgba(34,211,238,0.4);"></div>
    <div class="swatch-name">Cyan 500</div>
    <div class="swatch-hex">#22D3EE</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#67E8F9;"></div>
    <div class="swatch-name">Cyan 400</div>
    <div class="swatch-hex">#67E8F9</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#B48F4A; box-shadow: 0 0 20px rgba(180,143,74,0.4);"></div>
    <div class="swatch-name">Gold 500</div>
    <div class="swatch-hex">#B48F4A</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#C5A05B;"></div>
    <div class="swatch-name">Gold 400</div>
    <div class="swatch-hex">#C5A05B</div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#8B2E2E;"></div>
    <div class="swatch-name">Burgundy</div>
    <div class="swatch-hex">#8B2E2E</div>
  </div>
</div>
</body>
</html>
