<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0A1212; margin: 0; padding: 16px 20px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 8px; }
  .row:last-child { border-bottom: none; }
  .size-label { font-family: 'Fira Mono', monospace; font-size: 9px; color: #52525b; letter-spacing: 0.15em; width: 80px; flex-shrink: 0; }
  .sample { font-family: 'Cinzel', serif; color: #F1F5F9; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
  <div class="row"><div class="size-label">64px / Hero</div><div class="sample" style="font-size:42px;font-weight:900;line-height:1;">Prismarium</div></div>
  <div class="row"><div class="size-label">48px / XL</div><div class="sample" style="font-size:32px;font-weight:600;">The Library</div></div>
  <div class="row"><div class="size-label">36px / LG</div><div class="sample" style="font-size:26px;font-weight:600;">Seven Lenses</div></div>
  <div class="row"><div class="size-label">30px / MD</div><div class="sample" style="font-size:21px;font-weight:600;font-family:'Cormorant Garamond',serif;font-style:italic;">The Scholar's Study</div></div>
  <div class="row"><div class="size-label">24px / SM</div><div class="sample" style="font-size:17px;font-family:'Inter',sans-serif;font-weight:600;color:#A1A1AA;">Section heading</div></div>
  <div class="row"><div class="size-label">16px / Base</div><div class="sample" style="font-size:13px;font-family:'Inter',sans-serif;color:#A1A1AA;font-weight:400;">Body copy — readable at length</div></div>
  <div class="row"><div class="size-label">11px / XS</div><div class="sample" style="font-size:9px;font-family:'Fira Mono',monospace;letter-spacing:0.2em;text-transform:uppercase;color:#52525b;">LABEL · BADGE · META</div></div>
</body>
</html>
