<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #07090f; margin: 0; padding: 14px 16px; font-family: 'Inter', sans-serif; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  /* Book card */
  .book-card { width: 90px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); background: #111; transition: all 0.2s; cursor: pointer; }
  .book-card:hover { border-color: rgba(180,143,74,0.5); box-shadow: 0 0 20px rgba(180,143,74,0.18); transform: scale(1.03); }
  .book-cover { height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 11px; font-style: italic; color: #52525b; text-align: center; padding: 8px; background: #0d1020; }
  /* Glass card */
  .glass-card { flex: 1; min-width: 200px; border-radius: 10px; padding: 14px; background: rgba(10,18,18,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); }
  .glass-card:hover { border-color: rgba(34,211,238,0.28); box-shadow: 0 0 20px rgba(6,182,212,0.12); }
  .card-eyebrow { font-family: 'Fira Mono', monospace; font-size: 9px; color: #22D3EE; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.8; margin-bottom: 6px; }
  .card-title   { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: #F1F5F9; margin-bottom: 5px; }
  .card-body    { font-size: 12px; color: #71717a; line-height: 1.5; }
  /* Expanded modal card snippet */
  .modal-card { flex: 1; min-width: 200px; border-radius: 10px; padding: 14px; background: #111; border: 1px solid rgba(180,143,74,0.28); box-shadow: 0 10px 40px rgba(180,143,74,0.12); }
  .author { font-family: 'Fira Mono', monospace; font-size: 10px; color: #B48F4A; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; }
  .curator { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-style: italic; color: #A1A1AA; }
</style>
</head>
<body>
<div class="row" style="margin-bottom:10px;">
  <div class="book-card"><div class="book-cover">The Kybalion</div></div>
  <div class="book-card"><div class="book-cover">Emerald Tablet</div></div>
  <div class="book-card"><div class="book-cover">Bhagavad Gita</div></div>

  <div class="glass-card">
    <div class="card-eyebrow">Study Journal</div>
    <div class="card-title">Hermetic Principles</div>
    <div class="card-body">Notes on the seven principles of Hermeticism and their relationship to Jungian psychology…</div>
  </div>

  <div class="modal-card">
    <div class="author">// Hermes Trismegistus</div>
    <div class="card-title" style="font-family:'Cinzel',serif;font-size:13px;color:#F1F5F9;margin-bottom:6px;">The Emerald Tablet</div>
    <div class="curator">"As above, so below — the great synthesis of macrocosm and microcosm."</div>
  </div>
</div>
</body>
</html>
