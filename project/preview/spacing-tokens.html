<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0A1212; margin: 0; padding: 16px; font-family: 'Fira Mono', monospace; }
  .section-label { font-size: 9px; color: #52525b; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .sp { border-radius: 4px; background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.15); padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .sp-bar { background: rgba(34,211,238,0.35); border-radius: 2px; min-width: 4px; }
  .sp-val { font-size: 9px; color: #22D3EE; }
  .radius-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .radius-item { padding: 10px 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
  .radius-name { font-size: 9px; color: #71717a; letter-spacing: 0.1em; text-transform: uppercase; }
  .radius-val  { font-size: 10px; color: #a1a1aa; margin-top: 1px; }
</style>
</head>
<body>
<div class="section-label">Spacing Scale</div>
<div class="row">
  <div class="sp"><div class="sp-bar" style="width:4px;height:4px;"></div><div class="sp-val">4</div></div>
  <div class="sp"><div class="sp-bar" style="width:8px;height:8px;"></div><div class="sp-val">8</div></div>
  <div class="sp"><div class="sp-bar" style="width:12px;height:12px;"></div><div class="sp-val">12</div></div>
  <div class="sp"><div class="sp-bar" style="width:16px;height:16px;"></div><div class="sp-val">16</div></div>
  <div class="sp"><div class="sp-bar" style="width:20px;height:20px;"></div><div class="sp-val">20</div></div>
  <div class="sp"><div class="sp-bar" style="width:24px;height:24px;"></div><div class="sp-val">24</div></div>
  <div class="sp"><div class="sp-bar" style="width:32px;height:32px;"></div><div class="sp-val">32</div></div>
  <div class="sp"><div class="sp-bar" style="width:40px;height:40px;"></div><div class="sp-val">40</div></div>
  <div class="sp"><div class="sp-bar" style="width:48px;height:48px;"></div><div class="sp-val">48</div></div>
  <div class="sp"><div class="sp-bar" style="width:64px;height:64px;"></div><div class="sp-val">64</div></div>
</div>

<div class="section-label">Border Radius</div>
<div class="radius-row">
  <div class="radius-item" style="border-radius:4px;"><div class="radius-name">sm</div><div class="radius-val">4px</div></div>
  <div class="radius-item" style="border-radius:8px;"><div class="radius-name">md</div><div class="radius-val">8px</div></div>
  <div class="radius-item" style="border-radius:12px;"><div class="radius-name">lg</div><div class="radius-val">12px</div></div>
  <div class="radius-item" style="border-radius:16px;"><div class="radius-name">xl</div><div class="radius-val">16px</div></div>
  <div class="radius-item" style="border-radius:9999px;"><div class="radius-name">full</div><div class="radius-val">9999px</div></div>
</div>
</body>
</html>
