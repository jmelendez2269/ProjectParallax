<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #08080e; margin: 0; padding: 20px 20px 12px; }
  .specimen { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .specimen:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-family: 'Fira Mono', monospace; font-size: 9px; color: #52525b; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 4px; }
  .hero-text {
    font-family: 'Cinzel', serif; font-size: 52px; font-weight: 900;
    letter-spacing: -0.01em; line-height: 0.92;
    background: linear-gradient(135deg, #FF3A5C 0%, #FF8C2A 16%, #F5D020 32%, #2AFFA0 48%, #20E0F5 64%, #3A7FFF 80%, #B03AFF 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .display-text { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; color: #F1F5F9; letter-spacing: -0.01em; line-height: 1.1; }
  .cinzel-label { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(180,140,255,0.75); }
</style>
</head>
<body>
  <div class="specimen">
    <div class="meta">Cinzel 900 — Hero / Brand</div>
    <div class="hero-text">Prismarium</div>
  </div>
  <div class="specimen">
    <div class="meta">Cinzel 600 — Display</div>
    <div class="display-text">The Convergence Machine</div>
  </div>
  <div class="specimen">
    <div class="meta">Cinzel 600 — Eyebrow Label</div>
    <div class="cinzel-label">The Living Library of Esoteric Wisdom</div>
  </div>
</body>
</html>
