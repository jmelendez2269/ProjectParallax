<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0A1212; margin: 0; padding: 18px 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .section-label { font-family: 'Fira Mono', monospace; font-size: 9px; color: #52525b; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }

  /* shared base */
  .btn {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 100px; cursor: pointer;
    background: transparent; border: 1.5px solid; transition: all 0.22s ease;
    display: inline-block; text-decoration: none; white-space: nowrap;
  }

  /* Cyan / Prismarium */
  .btn-cyan {
    color: #4EE7FD; border-color: rgba(78,231,253,0.5);
  }
  .btn-cyan:hover { border-color: #4EE7FD; color: #fff; box-shadow: 0 0 24px rgba(78,231,253,0.25); }

  /* Violet / Kairos */
  .btn-ghost {
    color: #9966FF; border-color: rgba(153,102,255,0.5);
  }
  .btn-ghost:hover { border-color: #9966FF; color: #fff; box-shadow: 0 0 24px rgba(153,102,255,0.25); }

  /* Amber / Chronos / Support */
  .btn-gold {
    color: #FF9B2B; border-color: rgba(255,155,43,0.5);
  }
  .btn-gold:hover { border-color: #FF9B2B; color: #fff; box-shadow: 0 0 24px rgba(255,155,43,0.2); }

  /* Bone / neutral */
  .btn-bone {
    color: rgba(242,239,230,0.65); border-color: rgba(242,239,230,0.18);
  }
  .btn-bone:hover { border-color: rgba(242,239,230,0.5); color: #F2EFE6; }

  /* Danger */
  .btn-danger {
    font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    padding: 9px 20px; border-radius: 100px; cursor: pointer;
    background: transparent; color: #f87171;
    border: 1.5px solid rgba(248,113,113,0.4);
    transition: all 0.2s ease;
  }
  .btn-danger:hover { border-color: #f87171; box-shadow: 0 0 18px rgba(248,113,113,0.18); }

  /* Disabled */
  .btn-disabled {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 100px;
    background: transparent; color: rgba(78,231,253,0.35);
    border: 1.5px solid rgba(78,231,253,0.18);
    opacity: 0.5; cursor: not-allowed;
  }

  /* Small icon button */
  .btn-icon {
    width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(242,239,230,0.4); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.18s;
  }
  .btn-icon:hover { border-color: rgba(78,231,253,0.4); color: #4EE7FD; }

  /* Pill / CTA variant — slightly tinted bg, still ghost-feel */
  .btn-join {
    font-family: 'Cinzel', serif; font-size: 10px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 10px 22px; border-radius: 100px; cursor: pointer;
    background: rgba(78,231,253,0.07); color: #4EE7FD;
    border: 1.5px solid rgba(78,231,253,0.5);
    transition: all 0.22s;
  }
  .btn-join:hover { background: rgba(78,231,253,0.14); border-color: #4EE7FD; box-shadow: 0 0 24px rgba(78,231,253,0.2); }
</style>
</head>
<body>
  <div class="section-label">Product Colors</div>
  <div class="row">
    <button class="btn btn-ghost">Start with Kairos</button>
    <button class="btn btn-cyan">Explore Prismarium</button>
    <button class="btn btn-gold">Support the Project</button>
    <button class="btn btn-bone">Learn More</button>
  </div>

  <div class="section-label">States &amp; Variants</div>
  <div class="row">
    <button class="btn-danger">Disconnect</button>
    <button class="btn-disabled" disabled>Signing in…</button>
    <button class="btn-join">Join Prismarium →</button>
    <button class="btn-icon" title="Edit">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="btn-icon" title="Search">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
</body>
</html>
